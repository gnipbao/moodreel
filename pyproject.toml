[project]
name = "moodreel"
version = "0.1.0"
description = "Moodboard in, reel out: distill a visual and motion style from references, then render new code-drawn films in it."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "opencv-python-headless>=4.10",
    "pillow>=10.0",
]

[project.scripts]
moodreel = "moodreel.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["moodreel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W"]          # pinned: newer ruff releases widen the default set
